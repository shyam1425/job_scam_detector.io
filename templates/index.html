<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake Job Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Fake Job & Internship Detector</h2>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label>Company Name</label>
                <!-- ===== BUG FIX ===== -->
                <input type="text" name="company_name" class="form-control">
                <div class="form-text text-muted small">Optional - Leave empty if unknown.</div>
                <!-- ===== END BUG FIX ===== -->
            </div>

            <div class="mb-3">
                <label>Job Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="4" required></textarea>
            </div>

            <div class="mb-3">
                <label>HR Email</label>
                <input type="email" name="email" class="form-control">
                <div class="form-text text-muted small">Optional – Provide HR email if available.</div>
            </div>

            <div class="mb-3">
                <label>Company Website</label>
                <input type="text" name="website" class="form-control" placeholder="Company website (optional)">
            </div>

            <!-- ===== NEW CODE ===== -->
            <div class="mb-3">
                <label>Job URL</label>
                <input type="url" name="job_url" class="form-control" placeholder="Paste job posting URL (LinkedIn, Naukri, etc)">
            </div>
            <!-- ===== END NEW CODE ===== -->

            <div class="mb-3">
                <label>Upload Offer Letter / Document (PDF/Image)</label>
                <input type="file" name="file" class="form-control">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Analyze Job
                </button>
            </div>

        </form>

        <div class="text-center mt-3">
            <a href="/dashboard">Go to Admin Dashboard</a>
        </div>

    </div>
</div>

</body>
</html>
